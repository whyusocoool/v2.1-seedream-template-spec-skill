<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{DOCUMENT_TITLE}}</title>
  <style>
    :root{--ink:#171717;--muted:#686868;--line:#dededb;--paper:#fff;--ground:#f2f2f0;--pass:#087a55;--warn:#a45a00;--fail:#a02b2b;--dark:#171717}
    *{box-sizing:border-box}body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","PingFang SC",Arial,sans-serif}
    .board{width:min(1160px,calc(100% - 32px));margin:28px auto;padding:44px 52px 50px;background:var(--paper);box-shadow:0 8px 30px rgba(0,0,0,.06)}
    .hero{display:grid;grid-template-columns:1fr 220px;gap:38px;padding-bottom:28px;border-bottom:1px solid var(--line)}
    .eyebrow,.label{color:var(--muted);font-size:11px;font-weight:750;letter-spacing:.13em;text-transform:uppercase}.label{letter-spacing:.08em}
    h1{margin:6px 0 4px;font-size:34px;line-height:1.2}.subtitle{color:var(--muted)}.status-card{padding-left:26px;border-left:1px solid var(--line)}
    .fit-title-line{display:flex;align-items:center;flex-wrap:wrap;gap:9px}.fit-title-line h1{margin-right:3px}.prompt-version,.model-version{display:inline-flex;align-items:center;padding:5px 11px;border:1px solid #cececa;border-radius:999px;background:#f1f1ef;font-size:15px;font-weight:750;line-height:1;white-space:nowrap}.model-version{background:#fff;font-size:12px;color:var(--muted)}
    .status{margin-top:6px;font-size:25px;font-weight:800;line-height:1.15}.pass{color:var(--pass)}.warn{color:var(--warn)}.fail{color:var(--fail)}.neutral{color:#45515b}
    section{padding-top:28px}.page{break-after:page;page-break-after:always}.page:last-child{break-after:auto;page-break-after:auto}h2{margin:0 0 15px;padding:7px 10px;background:#f1f1ef;font-size:12px;letter-spacing:.10em;text-transform:uppercase}h3{margin:0 0 7px;font-size:14px}p{margin:0}.muted{color:var(--muted)}h1 span{color:var(--muted);font-size:.48em;font-weight:650;letter-spacing:.05em}
    .grid-2,.grid-3{display:grid;gap:14px}.grid-2{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:repeat(3,1fr)}
    .card{padding:18px;border:1px solid var(--line);break-inside:avoid}.card p+div,.card p+p{margin-top:8px}.meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
    .pill{padding:4px 8px;border:1px solid #cececa;border-radius:999px;background:#fafaf8;font-size:11px}.pill.pass{border-color:#a7d8c6}.pill.warn{border-color:#e1c293}.pill.fail{border-color:#e0aeae}
    ul{margin:9px 0 0;padding-left:19px}.plain{padding:0;list-style:none}.plain li+li{margin-top:7px}
    .prompt-box{position:relative;padding:25px 28px;background:var(--dark);color:#fff;break-inside:avoid}.prompt-box h2{color:#aaa}.prompt{padding-right:110px;font-size:15px;line-height:1.7;white-space:pre-wrap}
    .copy-button{position:absolute;top:22px;right:23px;padding:8px 12px;border:1px solid #666;border-radius:6px;background:#282828;color:#fff;cursor:pointer}
    .table-scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
    .references{display:grid;grid-template-columns:repeat(var(--ref-count),1fr);gap:10px}.reference{margin:0}.reference img{display:block;width:100%;height:140px;object-fit:contain;background:#e8e8e5}.reference figcaption{margin-top:5px;color:var(--muted);font-size:11px}
    .change{display:grid;grid-template-columns:110px 1fr;gap:16px;padding:14px 0;border-top:1px solid var(--line)}.change:first-child{border-top:0}.before-after{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:9px}.before-after div{padding:12px;background:#f6f6f3}
    .gate{display:grid;grid-template-columns:180px 120px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.gate:first-child{border-top:0}
    .score-count{display:inline-block;margin-right:8px;white-space:nowrap}.score-zero{color:var(--fail)}.evidence-line{margin-top:10px!important;padding-top:8px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.ux-review{margin-bottom:7px;padding:8px 10px;border-left:3px solid var(--warn);background:#fff8ed;font-size:11px}.ux-review p{margin-top:3px}.decision-note{margin:6px 0 0;color:var(--muted);font-size:11px}.no-candidate{padding-top:6px;border-top:1px solid var(--line)}.appendix-head{display:grid;grid-template-columns:160px 1fr;gap:18px;align-items:end;margin-bottom:14px}.appendix-head h1{font-size:20px}.appendix-head>div{display:grid;grid-template-columns:1fr 1fr 125px;gap:10px;color:var(--muted);font-size:11px;font-weight:750;letter-spacing:.12em}.evidence-row{display:grid;grid-template-columns:58px 1fr 1fr 125px;gap:10px;padding:10px 0;border-top:1px solid var(--line);break-inside:avoid}.evidence-id span{display:block;color:var(--muted);font-size:11px}.evidence-side{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px}.evidence-side figure{margin:0}.evidence-side img{display:block;width:100%;height:270px;object-fit:contain;background:#ecece8}.evidence-side figcaption{margin-top:4px;color:var(--muted);font-size:10px}.evidence-scores{align-self:stretch;padding:4px 0;font-size:10px}.rule-score-line{display:grid;grid-template-columns:30px 1fr auto;gap:4px;padding:3px 4px;border-bottom:1px solid #ececea}.rule-score-line span{color:var(--muted);font-size:9px}.rule-score-line b{font-weight:700}.rule-score-line.critical{border-radius:3px;background:#fbeaea;color:var(--fail)}.rule-score-line.critical span{color:var(--fail)}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media screen and (max-width:760px){.board{width:100%;margin:0;padding:28px 20px}.hero,.grid-2,.grid-3,.before-after,.evidence-row,.appendix-head{grid-template-columns:1fr}.status-card{padding-left:0;border-left:0}.gate{grid-template-columns:1fr}.references{grid-template-columns:repeat(2,1fr)}.prompt{padding-right:0}.copy-button{position:static;margin-top:16px}}
    @page{size:A4;margin:9mm}@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}body{background:#fff;font-size:9.5px;line-height:1.34}.board{width:auto;margin:0;padding:0;box-shadow:none}.hero{grid-template-columns:1fr 180px;gap:16px;padding-bottom:10px}.status{font-size:20px}h1{font-size:22px}.prompt-version{padding:4px 9px;font-size:13px}.model-version{padding:4px 8px;font-size:9px}section{padding-top:10px}h2{margin-bottom:8px;padding:5px 7px}.grid-2,.grid-3{gap:8px}.grid-2{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:repeat(3,1fr)}.card{padding:8px}.references{grid-template-columns:repeat(var(--ref-count),1fr);gap:7px}.reference img{height:65px}.prompt-box{padding:12px 14px}.prompt{padding-right:0;font-size:9.5px}.copy-button,.sr-only{display:none!important}.gate{grid-template-columns:120px 85px 1fr;padding:5px 0}.change{grid-template-columns:80px 1fr;padding:6px 0}.evidence-row{grid-template-columns:48px 1fr 1fr 105px;gap:7px;padding:7px 0}.evidence-side img{height:236px}.evidence-scores{font-size:8px}.rule-score-line{grid-template-columns:24px 1fr auto;padding:2px 3px}.rule-score-line span{font-size:7px}.appendix-head{grid-template-columns:150px 1fr;margin-bottom:8px}.appendix-head>div{grid-template-columns:1fr 1fr 105px;gap:7px}}
  </style>
</head>
<body><main class="board">{{REPORT_BODY}}</main>{{COPY_SCRIPT}}</body>
</html>
