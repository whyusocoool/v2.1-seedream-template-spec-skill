<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{DOCUMENT_TITLE}}</title>
  <style>
    :root { --ink:#171717; --muted:#696969; --line:#dedede; --paper:#fff; --ground:#f2f2f0; --pass:#087a55; --warn:#a45a00; --fail:#a02b2b; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--ground); color:var(--ink); font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","PingFang SC",Arial,sans-serif; }
    .board { width:min(1160px,calc(100% - 32px)); margin:28px auto; padding:44px 52px 50px; background:var(--paper); box-shadow:0 8px 30px rgba(0,0,0,.06); }
    .eyebrow,.label { color:var(--muted); font-size:11px; font-weight:700; letter-spacing:.13em; text-transform:uppercase; }
    .hero { display:grid; grid-template-columns:1fr 180px; gap:42px; align-items:start; padding-bottom:28px; border-bottom:1px solid var(--line); }
    h1 { margin:6px 0 8px; font-size:36px; line-height:1.16; letter-spacing:-.02em; }
    .runtime { color:var(--muted); }
    .score-card { border-left:1px solid var(--line); padding-left:28px; }
    .score { margin-top:5px; font-size:54px; font-weight:750; line-height:1; }
    .status { margin-top:7px; font-size:13px; font-weight:800; letter-spacing:.08em; }
    .status.pass { color:var(--pass); } .status.warn { color:var(--warn); } .status.fail { color:var(--fail); }
    section { padding-top:32px; }
    .page { break-after:page; page-break-after:always; }
    .page:last-child { break-after:auto; page-break-after:auto; }
    .grid-2,.grid-3 { display:grid; gap:14px; }
    .grid-2 { grid-template-columns:repeat(2,1fr); }
    .grid-3 { grid-template-columns:repeat(3,1fr); }
    .card { padding:15px 16px; border:1px solid var(--line); break-inside:avoid; }
    .muted { color:var(--muted); }
    .pill { display:inline-block; padding:2px 7px; border:1px solid #ccc; border-radius:999px; font-size:10px; }
    table { width:100%; border-collapse:collapse; font-size:12px; }
    th,td { padding:8px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
    th { color:var(--muted); font-size:10px; letter-spacing:.06em; }
    h2 { margin:0 0 16px; padding:7px 10px; background:#f1f1ef; font-size:12px; letter-spacing:.08em; text-transform:uppercase; }
    h3 { margin:0 0 7px; font-size:12px; letter-spacing:.06em; text-transform:uppercase; }
    p { margin:0; }
    .references { display:grid; grid-template-columns:repeat(var(--ref-count),1fr); gap:10px; }
    .reference { min-width:0; }
    .reference img { width:100%; height:150px; display:block; object-fit:contain; background:#e8e8e5; }
    .reference figcaption { margin-top:6px; color:var(--muted); font-size:11px; }
    .alignment-grid,.dna-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
    .metric,.dna-item,.direction { padding:15px 16px; border:1px solid var(--line); break-inside:avoid; }
    .metric .verdict { margin-top:5px; font-weight:650; }
    .metric p,.direction p { color:var(--muted); font-size:13px; }
    .target { display:grid; grid-template-columns:1.55fr 1fr; gap:34px; align-items:start; padding:30px; background:#f4f4f1; break-inside:avoid; }
    .target-copy { font-size:25px; line-height:1.38; letter-spacing:-.01em; }
    .keywords { display:flex; flex-wrap:wrap; gap:7px; }
    .chip { padding:6px 9px; border:1px solid #cfcfca; border-radius:999px; background:#fff; font-size:12px; }
    .dna-item p { font-size:13px; }
    .rules { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
    .applicability-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
    .applicability-card { padding:18px; border:1px solid var(--line); break-inside:avoid; }
    .applicability-card ul { margin:10px 0 0; padding:0; list-style:none; }
    .applicability-card li + li { margin-top:10px; }
    .applicability-card strong,.applicability-card span { display:block; }
    .applicability-card span { margin-top:3px; color:var(--muted); font-size:12px; }
    .rule-panel { padding:22px; border:1px solid var(--line); break-inside:avoid; }
    .rule-panel ul,.compact-list { margin:12px 0 0; padding:0; list-style:none; }
    .rule-panel li { display:flex; gap:10px; margin-top:9px; }
    .must-mark { color:var(--pass); } .avoid-mark { color:var(--fail); }
    .prompt-box { position:relative; margin-top:24px; padding:0; background:#fff; color:var(--ink); border:1px solid var(--line); break-inside:avoid; }
    .prompt-head { display:flex; justify-content:space-between; gap:20px; padding:8px 12px; background:#f1f1ef; font-size:11px; letter-spacing:.07em; text-transform:uppercase; }
    .prompt { padding:16px 18px; font-size:15px; line-height:1.66; }
    .version-tag { display:inline-block; padding:3px 8px; border-radius:999px; background:#fff; border:1px solid #ccc; color:var(--muted); font-size:10px; font-weight:700; }
    .hero-reference img { height:240px; }
    .empty-note { padding:16px; background:#f6f6f4; color:var(--muted); }
    h1 span { color:var(--muted); font-size:.48em; font-weight:650; letter-spacing:.05em; }
    .title-row { display:flex; justify-content:space-between; gap:24px; align-items:baseline; }
    .prompt-version-fill { min-width:150px; padding:5px 10px; background:#f1f1ef; color:var(--muted); font-size:12px; font-weight:700; letter-spacing:.06em; }
    .blank-cell { height:42px; }
    .score-cell { white-space:nowrap; }
    .copy-button { position:absolute; top:23px; right:24px; padding:8px 12px; border:1px solid #686868; border-radius:6px; color:#fff; background:#282828; cursor:pointer; }
    .copy-button:focus-visible { outline:2px solid #fff; outline-offset:2px; }
    .failure { padding:28px; border:1px solid var(--line); background:#fafaf8; }
    .failure-lead { margin-bottom:22px; font-size:20px; }
    .failure-grid { display:grid; grid-template-columns:1fr 1fr; gap:22px; }
    .failure ul { margin:8px 0 0; padding-left:18px; }
    .resolve { margin-top:24px; padding-top:18px; border-top:1px solid var(--line); font-weight:700; }
    .directions { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:18px; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    @media screen and (max-width:760px) { .board{width:100%;margin:0;padding:28px 20px}.hero,.target,.rules,.failure-grid,.applicability-grid,.grid-2,.grid-3{grid-template-columns:1fr}.score-card{border-left:0;padding-left:0}.references{grid-template-columns:repeat(2,1fr)}.alignment-grid,.dna-grid{grid-template-columns:1fr}.prompt{padding-right:0}.copy-button{position:static;margin-top:18px} }
    @page { size:A4; margin:10mm; }
    @media print {
      * { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
      body { background:#fff; font-size:10.5px; line-height:1.42; }
      .board { width:auto; margin:0; padding:0; box-shadow:none; }
      .hero { grid-template-columns:1fr 120px; gap:20px; padding-bottom:14px; }
      .target { grid-template-columns:1.55fr 1fr; }
      .rules,.failure-grid { grid-template-columns:1fr 1fr; }
      .grid-2 { grid-template-columns:repeat(2,1fr); }
      .grid-3 { grid-template-columns:repeat(3,1fr); }
      .alignment-grid,.dna-grid { grid-template-columns:repeat(3,1fr); }
      .applicability-grid { grid-template-columns:repeat(3,1fr); }
      .references { grid-template-columns:repeat(var(--ref-count),1fr); }
      h1 { font-size:24px; } .score { font-size:38px; }
      section { padding-top:17px; } h2 { margin-bottom:9px; padding:5px 7px; }
      .reference img { height:78px; }
      .hero-reference img { height:145px; }
      .metric,.dna-item,.direction { padding:8px 9px; }
      .applicability-card { padding:9px; }
      .target { padding:16px; gap:18px; } .target-copy { font-size:16px; }
      .rule-panel { padding:12px; } .rule-panel li { margin-top:4px; }
      .prompt-box { padding:0; } .prompt { padding:10px 12px; font-size:10.5px; line-height:1.5; }
      .copy-button,.sr-only { display:none !important; }
    }
  </style>
</head>
<body>
  <main class="board">
    {{REPORT_BODY}}
  </main>
  {{COPY_SCRIPT}}
</body>
</html>
